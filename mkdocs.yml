site_name: Dual Exposure Stereo
site_description: Documentation for the CVPR 2025 paper "Dual Exposure Stereo for Extended Dynamic Range 3D Imaging"
site_author: ADEC Contributors
docs_dir: docs
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Paper and Project: paper.md
  - Method Overview: method.md
  - Repository Guide: repository.md
  - Data and Checkpoints: data-and-checkpoints.md
  - Reproducibility: reproducibility.md
  - Citation: citation.md
